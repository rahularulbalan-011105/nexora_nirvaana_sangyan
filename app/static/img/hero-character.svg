<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Illustration of a smiling young Indian woman in a blue saree">
  <!-- Hero illustration for the landing page. Replace with final artwork
       (same aspect ratio, 4:5) by swapping this file. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe0cb"/>
      <stop offset="1" stop-color="#f3c9ab"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2238"/>
      <stop offset="1" stop-color="#15101f"/>
    </linearGradient>
    <linearGradient id="saree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#2b170b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halo behind the figure -->
  <ellipse cx="200" cy="260" rx="190" ry="210" fill="url(#glow)"/>

  <!-- hair, back layer -->
  <path d="M200 40 C116 40 78 104 84 186 C88 246 66 300 74 362 C82 420 108 452 146 462
           L254 462 C296 452 322 414 326 356 C332 296 312 244 316 184 C320 102 282 40 200 40 Z"
        fill="url(#hair)"/>
  <path d="M96 300 C90 350 98 400 124 440" stroke="#3a3150" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M304 300 C312 350 304 400 280 440" stroke="#3a3150" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- neck -->
  <path d="M176 318 L224 318 L228 396 C212 408 188 408 172 396 Z" fill="#efbf9e"/>
  <path d="M176 330 C192 346 208 346 224 330 L224 344 C208 360 192 360 176 344 Z" fill="#e2ab88" opacity="0.7"/>

  <!-- blouse / body -->
  <path d="M84 500 C86 432 126 396 200 392 C274 396 314 432 316 500 Z" fill="#fff5e8"/>
  <!-- saree pallu over the shoulder -->
  <path d="M244 392 C290 398 314 432 316 500 L160 500 C196 470 230 440 244 392 Z" fill="url(#saree)"/>
  <path d="M244 392 C230 440 196 470 160 500" stroke="#f5b942" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M252 420 C240 452 214 476 190 496" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M276 430 C268 460 250 482 232 498" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="262" cy="470" r="3" fill="#fde68a"/>
  <circle cx="284" cy="452" r="3" fill="#fde68a"/>
  <circle cx="290" cy="486" r="3" fill="#fde68a"/>
  <!-- necklace -->
  <path d="M172 398 C186 414 214 414 228 398" stroke="#e0a526" stroke-width="3.5" fill="none"/>
  <circle cx="200" cy="414" r="5" fill="#f5b942" stroke="#c9861a" stroke-width="1.5"/>

  <!-- ears + jhumkas -->
  <ellipse cx="114" cy="244" rx="14" ry="22" fill="#f1c4a5"/>
  <ellipse cx="286" cy="244" rx="14" ry="22" fill="#f1c4a5"/>
  <g fill="#f5b942" stroke="#c9861a" stroke-width="1.5">
    <circle cx="114" cy="270" r="4"/>
    <path d="M104 290 Q114 274 124 290 Z"/>
    <circle cx="286" cy="270" r="4"/>
    <path d="M276 290 Q286 274 296 290 Z"/>
  </g>
  <g fill="#f5b942"><circle cx="108" cy="294" r="2"/><circle cx="114" cy="295" r="2"/><circle cx="120" cy="294" r="2"/>
    <circle cx="280" cy="294" r="2"/><circle cx="286" cy="295" r="2"/><circle cx="292" cy="294" r="2"/></g>

  <!-- face -->
  <ellipse cx="200" cy="232" rx="88" ry="102" fill="url(#skin)"/>

  <!-- hair, front fringe with side parting -->
  <path d="M108 222 C98 136 146 92 204 92 C264 92 306 138 294 222
           C288 176 262 146 222 136 C206 166 166 192 108 222 Z" fill="url(#hair)"/>
  <path d="M222 136 C232 160 256 182 280 196" stroke="#3a3150" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M150 116 C176 104 206 102 228 108" stroke="#4a4066" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- bindi -->
  <circle cx="200" cy="190" r="5.5" fill="#dc2638"/>

  <!-- eyebrows -->
  <path d="M142 204 Q162 194 182 202" stroke="#2a1d2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M218 202 Q238 194 258 204" stroke="#2a1d2e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <ellipse cx="163" cy="242" rx="20" ry="24" fill="#ffffff"/>
    <ellipse cx="164" cy="245" rx="15" ry="19" fill="url(#iris)"/>
    <ellipse cx="164" cy="247" rx="7.5" ry="9.5" fill="#120a06"/>
    <circle cx="158" cy="238" r="5" fill="#ffffff"/>
    <circle cx="170" cy="252" r="2.4" fill="#ffffff"/>
    <path d="M141 236 Q160 214 185 232" stroke="#120a06" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M143 233 L134 226" stroke="#120a06" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="237" cy="242" rx="20" ry="24" fill="#ffffff"/>
    <ellipse cx="236" cy="245" rx="15" ry="19" fill="url(#iris)"/>
    <ellipse cx="236" cy="247" rx="7.5" ry="9.5" fill="#120a06"/>
    <circle cx="230" cy="238" r="5" fill="#ffffff"/>
    <circle cx="242" cy="252" r="2.4" fill="#ffffff"/>
    <path d="M215 232 Q240 214 259 236" stroke="#120a06" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M257 233 L266 226" stroke="#120a06" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- nose, cheeks, smile -->
  <path d="M198 270 Q202 278 196 280" stroke="#d99a7a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="142" cy="282" rx="17" ry="10" fill="#f59e9e" opacity="0.45"/>
  <ellipse cx="258" cy="282" rx="17" ry="10" fill="#f59e9e" opacity="0.45"/>
  <path d="M182 294 Q200 312 218 294 Q200 302 182 294 Z" fill="#c2414b"/>
  <path d="M182 294 Q200 312 218 294" stroke="#a8323b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
